# The identity the SQL tests connect as: a ServiceAccount bound to a
# read-only ClusterRole (get/list/watch only, pod logs included).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vgi-sql
  namespace: vgi-fixture
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vgi-sql-reader
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/version", "/api", "/api/*", "/apis", "/apis/*"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vgi-sql-reader
subjects:
  - {kind: ServiceAccount, name: vgi-sql, namespace: vgi-fixture}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: vgi-sql-reader}
