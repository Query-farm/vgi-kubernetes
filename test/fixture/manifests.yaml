# Fixture objects for the SQL tests (applied by ci/kind-fixture.sh).
# Everything lives in namespace vgi-fixture except the cluster-scoped objects.
apiVersion: v1
kind: Namespace
metadata:
  name: vgi-fixture
  labels:
    team: platform
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: vgi-fixture-high
value: 100000
globalDefault: false
preemptionPolicy: Never
description: Fixture priority class.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: vgi-fixture
  labels: {app: web, tier: frontend}
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: web, tier: frontend}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: web
          image: busybox:1.36
          command: ["sh", "-c", "echo web ready; while true; do sleep 3600; done"]
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 64Mi}
        - name: sidecar
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: vgi-fixture
  labels: {app: web}
spec:
  selector: {app: web}
  ports:
    - {name: http, port: 80, targetPort: 8080, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: vgi-fixture
spec:
  rules:
    - host: web.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: web, port: {number: 80}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  namespace: vgi-fixture
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: web}
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 80}
---
apiVersion: v1
kind: Pod
metadata:
  name: crashy
  namespace: vgi-fixture
  labels: {app: crashy}
spec:
  terminationGracePeriodSeconds: 1
  priorityClassName: vgi-fixture-high
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo starting crashy; echo 'fatal error: boom' >&2; exit 3"]
      resources:
        requests: {cpu: 5m, memory: 8Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: hello
  namespace: vgi-fixture
  labels: {app: hello}
spec:
  restartPolicy: Never
  containers:
    - name: hello
      image: busybox:1.36
      command: ["sh", "-c", "echo line one; echo line two; echo line three"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: pi
  namespace: vgi-fixture
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: {app: pi}
    spec:
      restartPolicy: Never
      containers:
        - name: pi
          image: busybox:1.36
          command: ["sh", "-c", "echo 3.14159; echo done"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly
  namespace: vgi-fixture
spec:
  schedule: "0 3 * * *"
  timeZone: Etc/UTC
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: busybox:1.36
              command: ["sh", "-c", "echo report"]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: vgi-fixture
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels: {app: db}
  template:
    metadata:
      labels: {app: db}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: db
          image: busybox:1.36
          command: ["sh", "-c", "echo db ready; while true; do sleep 3600; done"]
          volumeMounts: [{name: storage, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: storage}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 256Mi}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agent
  namespace: vgi-fixture
spec:
  selector:
    matchLabels: {app: agent}
  template:
    metadata:
      labels: {app: agent}
    spec:
      terminationGracePeriodSeconds: 1
      tolerations: [{operator: Exists}]
      containers:
        - name: agent
          image: busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: vgi-fixture
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: vgi-fixture
data:
  log_level: debug
  feature_flags: "a,b"
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: vgi-fixture
type: Opaque
stringData:
  username: admin
  password: fixture-password-do-not-leak
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reporter
  namespace: vgi-fixture
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
  namespace: vgi-fixture
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["app-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reporter-reads-secrets
  namespace: vgi-fixture
subjects:
  - {kind: ServiceAccount, name: reporter, namespace: vgi-fixture}
  - {kind: User, name: alice, apiGroup: rbac.authorization.k8s.io}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: secret-reader}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: vgi-fixture
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-from-frontend
  namespace: vgi-fixture
spec:
  podSelector:
    matchLabels: {app: web}
  ingress:
    - from:
        - podSelector:
            matchLabels: {tier: frontend}
      ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: v1
kind: Event
metadata:
  name: crashy.fixture-warning
  namespace: vgi-fixture
type: Warning
reason: FixtureWarning
message: Synthetic warning recorded by the test fixture.
count: 3
involvedObject: {kind: Pod, namespace: vgi-fixture, name: crashy, apiVersion: v1}
source: {component: vgi-fixture}
firstTimestamp: "2026-01-01T00:00:00Z"
lastTimestamp: "2026-01-01T00:05:00Z"
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.fixture.vgi.query.farm
spec:
  group: fixture.vgi.query.farm
  scope: Namespaced
  names: {plural: widgets, singular: widget, kind: Widget, shortNames: [wdg]}
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size: {type: integer}
                color: {type: string}
            status:
              type: object
              properties:
                phase: {type: string}
      subresources:
        status: {}
