name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned together: the SQL test runner and the metadata checker must speak the
  # same VGI protocol as the SDK. Template updates bump these (make template-diff).
  HAYBARN_VERSION: "2.0.1rc3"
  # cgo: the worker imports vgi-go/vgi/exprduckdb as the exact-filter fallback.
  CGO_ENABLED: "1"
  # kind CLI for the fixture cluster (ci/kind-fixture.sh); it picks its default node image.
  KIND_VERSION: "v0.33.0"

jobs:
  quality:
    name: Lint + unit tests (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: make lint
      - run: make test-unit

  integration:
    name: SQL tests (${{ matrix.os }}, ${{ matrix.transport }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The SQL tests read a throwaway kind (Kubernetes-in-Docker) cluster, which needs
        # Docker: Linux runners only.
        os: [ubuntu-latest]
        transport: [stdio, launch, http]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Build the worker and the recipes
        run: |
          exe=""; [ "$RUNNER_OS" = "Windows" ] && exe=.exe
          go build -o "bin/vgi-kubernetes-worker$exe" ./cmd/vgi-kubernetes-worker
          go build -o "bin/recipes$exe" ./examples
      - name: Install kind
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo install -m 0755 kind /usr/local/bin/kind && rm kind
          kind version && kubectl version --client
      - name: Install the SQL test runner
        run: |
          uv venv .tools
          uv pip install -p .tools "haybarn-unittest==${HAYBARN_VERSION}"
      - name: Run test/sql over ${{ matrix.transport }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then tools="$PWD/.tools/Scripts"; exe=.exe
          else tools="$PWD/.tools/bin"; exe=""; fi
          export WORKER="$PWD/bin/vgi-kubernetes-worker$exe"
          export HAYBARN_UNITTEST="$tools/haybarn-unittest$exe"
          export RECIPES_WORKER="$PWD/bin/recipes$exe"
          # Creates the kind cluster vgi-kubernetes-test, applies test/fixture (workloads, a
          # crash-looping pod, a CRD + instances, RBAC, events, metrics-server), runs the
          # suite as a read-only ServiceAccount, then deletes the cluster.
          TRANSPORT=${{ matrix.transport }} ci/kind-fixture.sh ci/run-integration.sh

  metadata:
    name: Metadata quality (vgi-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o bin/vgi-kubernetes-worker ./cmd/vgi-kubernetes-worker
      - name: Read fail_on from vgi-lint.toml
        id: lintcfg
        run: python3 -c 'import tomllib; print("fail_on=" + tomllib.load(open("vgi-lint.toml", "rb")).get("fail_on", "error"))' >> "$GITHUB_OUTPUT"
      - uses: Query-farm/vgi-lint-check@v2
        with:
          location: ${{ github.workspace }}/bin/vgi-kubernetes-worker
          # Set in vgi-lint.toml, so local runs and CI agree.
          fail-on: ${{ steps.lintcfg.outputs.fail_on }}
          # Credential-gated: every table and table function (pods, nodes, resources(),
          # pod_logs, ...) needs a reachable Kubernetes API server and a `kubernetes`
          # secret, so the examples cannot execute here. The SQL suite runs them all against
          # a kind cluster in the integration job (`make lint-fixture` executes them locally).
          execute: "false"

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t worker:ci .
      - name: HTTP /health
        run: |
          docker run -d --name smoke -p 8000:8000 worker:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && exit 0; sleep 1; done
          docker logs smoke; exit 1
